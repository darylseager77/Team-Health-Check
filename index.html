const QUESTIONS=[{"text": "When someone raises a formal complaint here, how is it usually handled?", "options": [{"text": "There's a clear process that's followed every time, and someone impartial looks into it", "score": 3}, {"text": "It's handled properly in the end, though we tend to work it out as we go", "score": 2}, {"text": "It's usually smoothed over informally, whether or not that sorts it out", "score": 1}, {"text": "It depends who's involved, because there's no consistent way of doing it", "score": 0}], "finding": "Complaints may not be handled the same way each time, and that's where unfairness and risk creep in.", "action": "Find your grievance policy and check it's current. Agree how you'd choose someone impartial to look into a complaint, and where you'd get advice."}, {"text": "When people's roles, hours or ways of working have changed here, how has it usually gone?", "options": [{"text": "It was planned ahead: advice taken, contracts checked, and people properly consulted before decisions were made", "score": 3}, {"text": "People were talked to, though the formal steps were sorted out along the way", "score": 2}, {"text": "Changes that were needed tended to be put off until there was no choice", "score": 1}, {"text": "Changes were announced, and any pushback was dealt with as it came", "score": 0}], "finding": "Changes to people's roles or hours may happen without enough planning or discussion, which is where disputes often start.", "action": "Before your next change, write down who it affects, what their contracts say, what you'll tell them and when, and take advice on the steps."}, {"text": "Two people in the team have clearly fallen out, and it's affecting everyone else. What usually happens?", "options": [{"text": "A manager talks to both of them early, helps them agree a way forward and checks in afterwards", "score": 3}, {"text": "We give them a little time to sort it out, then step in if it carries on", "score": 2}, {"text": "People work around them and leave it to settle", "score": 1}, {"text": "It rumbles on until someone leaves or makes a formal complaint", "score": 0}], "finding": "Disagreements may be left until they're harder, and costlier, to fix.", "action": "Think of a recent example and ask what stopped someone stepping in earlier: time, confidence, or not knowing how."}, {"text": "In a meeting, someone strongly disagrees with a decision. What's the most likely response?", "options": [{"text": "Their view is explored, and sometimes it changes the decision", "score": 3}, {"text": "They're listened to politely, and the decision usually stands", "score": 2}, {"text": "It gets awkward and the conversation moves on", "score": 1}, {"text": "It turns into grumbling after the meeting", "score": 0}], "finding": "Disagreement may be going underground instead of being talked through.", "action": "At your next team meeting, ask \"What would make this not work?\" before agreeing a decision, and thank whoever answers."}, {"text": "Someone in the team is struggling with their workload, a mistake they've made or something personal. How likely are they to say so?", "options": [{"text": "Very likely. They'd raise it early and expect support, not blame", "score": 3}, {"text": "Likely with some people, less so with others", "score": 2}, {"text": "Only once it's become a bigger problem", "score": 1}, {"text": "Unlikely. They'd keep their head down", "score": 0}], "finding": "People may not feel safe raising problems early, so they surface late, as absence, errors or resignations.", "action": "Next time something goes wrong, ask \"What can we learn?\" before \"Who did it?\". Make sure managers know what support is available and how to start a supportive conversation."}, {"text": "Think of someone who's a bit different from most of the team: newer, older or younger, from a different background, part-time or remote. How included are they?", "options": [{"text": "Fully. They're heard in meetings and get the same chances as everyone else", "score": 3}, {"text": "Included in the work, though they can miss out on informal chats and opportunities", "score": 2}, {"text": "They tend to be on the edge of things", "score": 1}, {"text": "Jokes or comments at their expense sometimes go unchallenged", "score": 0}], "finding": "Some people may be less included than others, which affects how much they contribute and how long they stay.", "action": "Look at who gets the visible work, the informal updates and the development chances, and whether that's spread fairly."}, {"text": "A busy period hits and one part of the team is swamped. What usually happens?", "options": [{"text": "People offer to help across roles without being asked", "score": 3}, {"text": "People help when a manager asks them to", "score": 2}, {"text": "Everyone focuses on their own work", "score": 1}, {"text": "It causes friction about who's pulling their weight", "score": 0}], "finding": "People may be working side by side, not as one team, and that shows most under pressure.", "action": "Agree as a team what \"busy\" looks like and who will help whom, before the next peak."}, {"text": "How often do people get a proper conversation about how they're doing and where they're heading?", "options": [{"text": "Regularly, and it leads to something", "score": 3}, {"text": "Mainly at a yearly review", "score": 2}, {"text": "Mostly when something's gone wrong", "score": 1}, {"text": "Rarely or never", "score": 0}], "finding": "People may not get enough feedback or sense of progress, which is one of the main reasons good people leave.", "action": "Have a short \"stay conversation\" with two or three people you'd hate to lose: what keeps them here, and what might make them leave?"}, {"text": "A manager needs to tell someone their work isn't up to standard. What usually happens?", "options": [{"text": "They raise it promptly and clearly, and agree next steps together", "score": 3}, {"text": "They raise it, though usually after waiting to see if it improves", "score": 2}, {"text": "They drop hints, or quietly redo the work themselves", "score": 1}, {"text": "They avoid it or pass it to someone more senior", "score": 0}], "finding": "Difficult conversations may be avoided or delayed, which lets small issues grow.", "action": "Pick one conversation that's been put off and plan the first two sentences. If you manage managers, help each of them do the same."}, {"text": "How do managers spend most of their week?", "options": [{"text": "Mainly leading and developing their team, alongside some hands-on work", "score": 3}, {"text": "A mix of doing the work and managing, with some support or training", "score": 2}, {"text": "Mostly doing the work, and fitting management in where they can", "score": 1}, {"text": "Firefighting most of the time, with little support", "score": 0}], "finding": "Managers may be stretched between doing and leading, often without training for the management side.", "action": "List which tasks managers could hand over or stop, and the one skill that would help them most."}, {"text": "If you asked five people what the organisation's priorities are this year, what would you hear?", "options": [{"text": "Much the same answer from all five", "score": 3}, {"text": "Similar themes, in different words", "score": 2}, {"text": "Five different answers", "score": 1}, {"text": "Mostly blank looks", "score": 0}], "finding": "People may not share a clear picture of what matters most, so effort gets spread thin.", "action": "Write your top three priorities for the year in one sentence each, and make sure every team hears them in person."}, {"text": "A big change is coming, such as a new system, a restructure or a new owner. How do people usually find out?", "options": [{"text": "Face to face, from their manager or the person leading the change, with the reasons and a chance to ask questions", "score": 3}, {"text": "By email or at an all-staff update, with questions taken afterwards", "score": 2}, {"text": "Bits leak out through the grapevine before anything official", "score": 1}, {"text": "Usually once it has already happened", "score": 0}], "finding": "Change may be landing on people instead of being led with them, which fuels rumour and resistance.", "action": "For your next change, plan who tells each team, face to face, with the reasons and time for questions."}];

const TYPES={"A": {"name": "The Steady All-Rounder", "description": "solid foundations across the board. Problems get dealt with, people can speak up, and managers mostly lead, not just firefight.", "watch": "comfort. Strong teams can drift when people move on or the business grows.", "ideas": ["Write down what makes your team work, so new managers inherit it as well as the job.", "Pick your lowest area and set one small improvement for the next quarter.", "Check you're ready for the employment law changes in 2027 (see \"What's changing\")."]}, "B": {"name": "The Big-Hearted Team", "description": "your lowest scores are in handling formal processes and conflict. Teams like this often run on goodwill and informal fixes.", "watch": "when something formal happens, such as a complaint, a dispute or a change to roles, it can quickly become stressful and risky.", "ideas": ["Check your key policies (grievance, discipline, change) are current, and that managers know where to find them.", "Agree how you'd choose someone impartial to look into a complaint, and where you'd get advice.", "Deal with disagreements early, before they turn formal."]}, "C": {"name": "The Well-Oiled Machine", "description": "your lowest scores are in people feeling safe, included and engaged. Teams like this often get things done, but people don't always say what they think.", "watch": "mistakes surfacing late, some people on the edge of things, and good people leaving without warning.", "ideas": ["Ask the team one honest question at your next meeting: \"What's one thing that gets in the way of your work?\"", "Have \"stay conversations\" with the people you'd least want to lose.", "Check who gets included in informal updates and opportunities."]}, "D": {"name": "The Stretched Middle", "description": "your lowest scores are in everyday management and leading change. In teams like this, managers are often holding things together.", "watch": "managers carrying too much, putting off difficult conversations, or never having been trained for the management side of the job.", "ideas": ["Ask each manager what they could hand over or stop doing.", "Plan one difficult conversation that's been put off.", "Make sure every team hears about priorities and changes face to face."]}, "E": {"name": "The Juggling Act", "description": "pressure in more than one area at once. If you're still standing, that says a lot about the people.", "watch": "trying to fix everything at once, which usually fixes nothing.", "ideas": ["Take your first suggestion below and do only that for the next month.", "Put a date on its first action.", "Use the free resource that goes with it. It's a good place to start before spending anything."]}};
const ABOUT=[{"text": "Your role:", "options": ["Owner or managing director", "HR or people lead", "Line manager", "Operations or health and safety lead", "Other"]}, {"text": "Organisation size:", "options": ["1–9", "10–49", "50–249", "250–999", "1,000+"]}, {"text": "Sector:", "options": ["Professional services", "Retail and hospitality", "Health and social care", "Education", "Manufacturing and construction", "Charity and public sector", "Other"]}];
const FOCUS=["Handling complaints and changes fairly", "Sorting out disagreements earlier", "People feeling able to speak up and included", "Keeping good people and pulling together", "Managers who manage with confidence", "Everyone pulling in the same direction"];
const CHANGES=["**Since 1 Oct 2026:** people have six months to bring most tribunal claims, up from three.", "**Since 30 Oct 2026:** employers must take \"all reasonable steps\" to prevent sexual harassment, including by customers and other third parties.", "**From 1 Jan 2027:** unfair dismissal protection starts after six months' service, down from two years, and the cap on unfair dismissal compensation is removed.", "**From March 2027:** dismissing staff in order to rehire them on worse terms (\"fire and rehire\") will in most cases be automatically unfair.", "**Date not yet set:** new rights for people on zero-hours and low-hours contracts."];

// Pure scoring: focus is an area index (0–5), or null for rule verification.
function evaluate(scores,focus=null){
 const areas=AREAS.map((_,i)=>scores[i*2]+scores[i*2+1]);
 const pillars=[areas[0]+areas[1],areas[2]+areas[3],areas[4]+areas[5]];
 let type,rule;
 if(pillars.filter(x=>x<=5).length>=2){type='E';rule='1: Two or more pillars score 5 or less';}
 else if(pillars.every(x=>x>=9)){type='A';rule='2: All three pillars score 9 or more';}
 else {const low=Math.min(...pillars),tied=pillars.map((v,i)=>v===low?i:-1).filter(i=>i>=0),fp=focus===null?-1:Math.floor(focus/2),chosen=tied.includes(fp)?fp:tied[0];type=['B','C','D'][chosen];rule='3: Lowest pillar'+(tied.length>1?' → rule 4: '+(tied.includes(fp)?'focus pillar breaks tie':'people risk, culture, leadership tie order'):'');}
 const eligible=areas.map((v,i)=>i).filter(i=>areas[i]<5);
 eligible.sort((a,b)=>(a===focus?-1:b===focus?1:areas[a]-areas[b]||a-b));
 const suggestions=eligible.slice(0,3).map(i=>({area:i,question:scores[i*2]<=scores[i*2+1]?i*2:i*2+1,reason:i===focus?'Focus area first':`Score ${areas[i]}; lowest score first, then pillar order and area number`}));
 const weakest=areas.indexOf(Math.min(...areas));
 return {areas,pillars,type,rule,suggestions,weakest};
}
const debug=new URLSearchParams(location.search).get('debug')==='1';
const app=document.getElementById('app'); let step=-1;const answers=Array(16).fill(null);
const mixed=[[1,3,0,2],[2,0,3,1],[1,2,3,0],[3,1,0,2]];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const band=n=>n>=5?'Strength':n>=3?'Room to grow':'Priority';
const foot=`<footer class="small">This is one person's view, so treat it as a starting point for a conversation, not a diagnosis. It isn't legal advice. Please don't name any individuals.</footer>`;
function debugBox(result){if(!debug)return '';const r=result||evaluate(answers.slice(3,15).map(x=>x===null?0:x),answers[15]);return `<aside id="debug"><h2>Debug testing aid</h2><p class="small">${result?'Completed answers':'Unanswered scenarios count as 0 in this preview.'}</p><pre>${esc(JSON.stringify({areaScores:r.areas,pillarScores:{peopleRisk:r.pillars[0],culture:r.pillars[1],leadership:r.pillars[2]},type:r.type,typeRule:r.rule,suggestionOrder:r.suggestions.map(s=>({area:s.area+1,question:s.question+1,reason:s.reason,questionReason:'Lower-scoring question; first question if tied'}))},null,2))}</pre><button id="random" class="secondary">Fill randomly</button></aside>`;}
function bindDebug(){if(debug)document.getElementById('random').onclick=()=>{ABOUT.forEach((q,i)=>answers[i]=Math.floor(Math.random()*q.options.length));for(let i=3;i<15;i++)answers[i]=Math.floor(Math.random()*4);answers[15]=Math.floor(Math.random()*6);step=16;render();};}
function render(){
 if(step===16){results();return;}
 if(step===-1){app.innerHTML=`<h1>Team Health Quiz</h1><p class="lead">What kind of team are you?</p><p>16 quick questions, about 3 minutes. Pick the answer that's closest to what <em>usually</em> happens in your team, not what should happen. You'll get your team type, how you score in six areas, and practical ideas you can use straight away. You don't need to give an email address to see your results.</p><p class="small">Your answers aren't stored. They're only used to show your results.</p><div class="actions"><button id="start">Start the quiz</button></div>${foot}${debugBox()}`;document.getElementById('start').onclick=()=>{step=0;render();};bindDebug();return;}
 let text,options,section;
 if(step<3){text=ABOUT[step].text;options=ABOUT[step].options.map((text,value)=>({text,value}));section='About you';}
 else if(step<15){const i=step-3;text=QUESTIONS[i].text;options=mixed[i%4].map(j=>({text:QUESTIONS[i].options[j].text,value:QUESTIONS[i].options[j].score}));section=AREAS[Math.floor(i/2)].name;}
 else{text='If you could improve one thing in the next six months, what would it be?';options=FOCUS.map((text,value)=>({text,value}));section='Your focus';}
 app.innerHTML=`<p class="eyebrow">Question ${step+1} of 16 · ${esc(section)}</p><progress value="${step+1}" max="16" aria-label="Quiz progress"></progress><p class="small">“Managers” in the questions means anyone who manages people, including you.</p><fieldset class="options"><legend tabindex="-1">${esc(text)}</legend>${options.map((o,i)=>`<label class="answer"><input type="radio" name="answer" value="${o.value}" ${answers[step]===o.value?'checked':''}><span>${esc(o.text)}</span></label>`).join('')}</fieldset><div class="actions"><button id="back" class="secondary">Back</button><button id="next" ${answers[step]===null?'disabled':''}>${step===15?'See my results':'Next'}</button></div>${debugBox()}`;
 app.querySelectorAll('input').forEach(el=>el.onchange=()=>{answers[step]=Number(el.value);document.getElementById('next').disabled=false;});
 document.getElementById('back').onclick=()=>{step--;render();};document.getElementById('next').onclick=()=>{if(answers[step]!==null){step++;render();}};bindDebug();app.querySelector('legend').focus();window.scrollTo(0,0);
}
function results(){const r=evaluate(answers.slice(3,15),answers[15]),t=TYPES[r.type];
 let strength='';if(r.type==='B'&&r.pillars[1]>=9)strength='Relationships look like a real strength.';if(r.type==='C'&&r.pillars[0]>=9)strength='Your processes look solid.';if(r.type==='D'&&r.pillars[1]>=9)strength='The team itself looks in good shape.';
 const ideas=`<ul>${t.ideas.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
 let chart='';for(let p=0;p<3;p++){chart+=`<section><h3>${esc(AREAS[p*2].pillar)}</h3>`;for(let i=p*2;i<p*2+2;i++){const b=band(r.areas[i]),colour=b==='Strength'?'strength':b==='Room to grow'?'grow':'priority',percent=Math.round(r.areas[i]/6*100);chart+=`<div class="area" style="--band:var(--${colour})"><div class="area-top"><strong>${esc(AREAS[i].name)}</strong><span>${percent}% · ${r.areas[i]}/6 · <b class="band">${b}</b></span></div><div class="bar" role="img" aria-label="${esc(AREAS[i].name)}: ${percent} per cent, ${b}"><div class="fill" style="width:${r.areas[i]/6*100}%"></div></div><p class="small">${b==='Strength'?'This is working well. Keep doing it.':b==='Room to grow'?'Some good habits, with gaps showing.':'This is likely to be holding you back.'}</p></div>`;}chart+='</section>';}
 const suggestions=r.suggestions.map((s,n)=>{const q=QUESTIONS[s.question];return `<article class="card"><h3>${n+1}. ${esc(AREAS[s.area].name)}</h3><p><strong>Finding:</strong> ${esc(q.finding)}</p><p><strong>First action:</strong> ${esc(q.action)}</p><p><strong>Free guidance:</strong></p><ul class="links">${AREAS[s.area].resource.map(x=>`<li><a href="${x.url}" target="_blank" rel="noopener noreferrer">${esc(x.label)}</a></li>`).join('')}</ul></article>`;}).join('');
 const body=`Hello,\n\nI've done the Team Health Quiz and I'd like to have a chat about my results.\n\nMy team type: Type ${r.type} — ${t.name}

${r.areas.map((n,i)=>`${AREAS[i].name}: ${n}/6 (${Math.round(n/6*100)}%)`).join('\n')}

Anything you'd like us to know (optional): 
`;
 app.innerHTML=`<div class="eyebrow">Your team type · Type ${r.type}</div><h1 tabindex="-1">${esc(t.name)}</h1><h2>What your answers suggest</h2><p>${esc(cap(t.description))}</p>${strength?`<p>${strength}</p>`:''}<h2>Watch out for</h2><p>${esc(cap(t.watch))}</p><h2>Try this</h2>${ideas}<section class="card"><h2>Your six areas</h2>${chart}</section><section><h2>Your top suggestions</h2>${suggestions||`<p>Every area is a Strength. Use these Type A ideas:</p><ul>${TYPES.A.ideas.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}</section><section class="card changes ${['B','E'].includes(r.type)?'prominent':''}"><h2>What's changing for you</h2><p class="small">Checked against the gov.uk Employment Rights Act timeline on 16 Nov 2026 (last updated 5 Nov 2026).</p><ul>${CHANGES.map(x=>`<li>${esc(x).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}</li>`).join('')}</ul><a href="https://www.gov.uk/government/publications/implementing-the-plan-to-make-work-pay-and-employment-rights-act/plan-to-make-work-pay-and-employment-rights-act-timeline-update" target="_blank" rel="noopener noreferrer">View the gov.uk timeline</a></section>${r.areas[r.weakest]<5?`<p>If you'd like support with ${esc(AREAS[r.weakest].name)}, WorkNest can help with: ${esc(AREAS[r.weakest].services)}.</p>`:''}<div class="actions"><button id="print">Save my results</button><a class="button" href="mailto:ld-team@example.com?subject=${encodeURIComponent('Team Health Quiz results')}&amp;body=${encodeURIComponent(body)}">Talk to us</a><span class="small">ld-team@example.com</span></div><p class="small contact">“Talk to us” opens your email app with your results. You choose whether to send it.</p><div class="actions"><button class="secondary" id="review">Review my answers</button></div>${foot}${debugBox(r)}`;
 document.getElementById('print').onclick=()=>window.print();document.getElementById('review').onclick=()=>{step=15;render();};bindDebug();app.querySelector('h1').focus();window.scrollTo(0,0);
}
render();
</script></body></html>
